<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infovis - Análisis de Rango Vocal</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        .header-panel {
            background: #1e1e1e;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .btn-start {
            background-color: #1DB954; color: white; border: none; padding: 15px 40px;
            font-size: 20px; font-weight: bold; border-radius: 30px; cursor: pointer;
            box-shadow: 0 0 15px rgba(29, 185, 84, 0.4); transition: 0.3s; margin: 10px;
        }
        .btn-start:hover { transform: scale(1.05); background-color: #1ed760; }

        .btn-reset {
            background-color: #ff9800; padding: 10px 20px; font-size: 16px; box-shadow: 0 0 10px rgba(255, 152, 0, 0.4);
        }
        .btn-reset:hover { background-color: #ffb74d; }

        .live-stats {
            display: flex; justify-content: space-around; margin-top: 15px; font-size: 18px;
        }
        .val { font-size: 28px; font-weight: bold; color: #1DB954; }

        .songs-panel {
            background: #1b1b1b;
            border: 1px solid #2a2a2a;
            border-radius: 16px;
            max-height: 520px;
            overflow-y: auto;
            padding: 18px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.25);
            margin-bottom: 20px;
        }
        .songs-panel h2 {
            margin: 0 0 14px;
            font-size: 22px;
            font-weight: 700;
            color: #ffffff;
        }
        .song-card {
            background: #282828; padding: 15px; border-radius: 8px; margin-bottom: 15px;
            position: relative; overflow: hidden;
            transition: background 0.3s, opacity 0.25s ease, transform 0.25s ease;
            opacity: 0;
            animation: songCardEnter 0.25s ease forwards;
            animation-delay: calc(var(--entry-index, 0) * 0.03s);
        }
        .song-info { display: flex; justify-content: space-between; margin-bottom: 10px; }
        .song-title { font-size: 18px; font-weight: bold; }
        .feedback-text { font-size: 14px; text-align: right; max-width: 50%; font-weight: 500; }
        @keyframes songCardEnter {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .viz-track {
            width: 100%; height: 24px; background: #333; border-radius: 12px;
            position: relative; overflow: hidden; border: 1px solid #444;
        }
        .viz-song-range {
            position: absolute; height: 100%; background: rgba(255, 255, 255, 0.2);
            border-left: 2px solid #fff; border-right: 2px solid #fff;
        }
        .viz-user-range {
            position: absolute; height: 100%; background: rgba(29, 185, 84, 0.6);
            transition: left 0.1s, width 0.1s;
        }

        .status-perfect { color: #1DB954; } 
        .status-transpose { color: #ffc107; } 
        .status-impossible { color: #f44336; } 
    </style>
</head>
<body>

<div class="header-panel">
    <h1>🎙️ Visualizador de Rango Vocal</h1>
    <p id="instructions">Haz clic en Activar. Canta tu nota más grave y sube hasta la más aguda. Si ocurre un error, presiona Reiniciar.</p>

    <button id="btnStart" class="btn-start" onclick="startSystem()">Activar Micrófono</button>
    <button id="btnReset" class="btn-start btn-reset" style="display:none;" onclick="resetRange()">🔄 Reiniciar Rango</button>

    <div id="statsPanel" class="live-stats" style="display: none;">
        <div>Grave<br><span id="valMin" class="val">-</span></div>
        <div>Escuchando...<br><span id="valCurrent" class="val" style="color:white;">-</span></div>
        <div>Agudo<br><span id="valMax" class="val">-</span></div>
        <div>Amplitud<br><span id="valSpan" class="val">0</span> <small>semitonos</small></div>
    </div>
</div>

<div class="songs-panel">
    <h2>Lista de canciones</h2>
    <div id="songsContainer"></div>
</div>

<script>
if (window.AnalyserNode && !window.AnalyserNode.prototype.getFloat32TimeDomainData) {
    let uint8 = new Uint8Array(2048);
    window.AnalyserNode.prototype.getFloat32TimeDomainData = function(array) {
        this.getByteTimeDomainData(uint8);
        for (let i = 0, imax = array.length; i < imax; i++) array[i] = (uint8[i] - 128) * 0.0078125;
    };
}
const songs = [{"track_name": "Saturday", "artist_name": "Twenty One Pilots", "min_midi": 63, "max_midi": 80}, {"track_name": "Stressed Out", "artist_name": "Twenty One Pilots", "min_midi": 64, "max_midi": 81}, {"track_name": "My Universe", "artist_name": "Coldplay X BTS", "min_midi": 54, "max_midi": 83}, {"track_name": "Heat Waves", "artist_name": "Glass Animals", "min_midi": 59, "max_midi": 78}, {"track_name": "To Die For", "artist_name": "Sam Smith", "min_midi": 67, "max_midi": 81}, {"track_name": "In Your Eyes", "artist_name": "The Weeknd", "min_midi": 65, "max_midi": 82}, {"track_name": "Everything I Wanted", "artist_name": "Billie Eilish", "min_midi": 52, "max_midi": 71}, {"track_name": "Circles", "artist_name": "Post Malone", "min_midi": 60, "max_midi": 79}, {"track_name": "Adore You", "artist_name": "Harry Styles", "min_midi": 70, "max_midi": 82}, {"track_name": "Blinding Lights", "artist_name": "The Weeknd", "min_midi": 65, "max_midi": 84}, {"track_name": "Nothing Else Matters", "artist_name": "Metallica", "min_midi": 62, "max_midi": 72}, {"track_name": "I Wanna Be Yours", "artist_name": "Arctic Monkeys", "min_midi": 58, "max_midi": 70}, {"track_name": "Drown", "artist_name": "Bring Me the Horizon", "min_midi": 59, "max_midi": 83}, {"track_name": "Sleepwalking", "artist_name": "Bring Me the Horizon", "min_midi": 64, "max_midi": 84}, {"track_name": "My Eyes Have Seen You", "artist_name": "The Doors", "min_midi": 69, "max_midi": 83}, {"track_name": "Don't Threaten Me with a Good Time", "artist_name": "Panic! At The Disco", "min_midi": 61, "max_midi": 85}, {"track_name": "Mercy", "artist_name": "Muse", "min_midi": 62, "max_midi": 84}, {"track_name": "Under Pressure", "artist_name": "Queen", "min_midi": 61, "max_midi": 86}, {"track_name": "Creep", "artist_name": "Radiohead", "min_midi": 59, "max_midi": 83}, {"track_name": "Basket Case", "artist_name": "Green Day", "min_midi": 64, "max_midi": 78}, {"track_name": "Everlong", "artist_name": "Foo Fighters", "min_midi": 59, "max_midi": 81}, {"track_name": "No One Knows", "artist_name": "Queens Of The Stone Age", "min_midi": 67, "max_midi": 83}, {"track_name": "Psycho", "artist_name": "Muse", "min_midi": 57, "max_midi": 86}, {"track_name": "Beautiful Day", "artist_name": "U2", "min_midi": 57, "max_midi": 81}, {"track_name": "Boulevard of Broken Dreams", "artist_name": "Green Day", "min_midi": 65, "max_midi": 80}, {"track_name": "Vertigo", "artist_name": "U2", "min_midi": 64, "max_midi": 83}, {"track_name": "Wake Me Up When September Ends", "artist_name": "Green Day", "min_midi": 62, "max_midi": 76}, {"track_name": "Knights of Cydonia", "artist_name": "Muse", "min_midi": 59, "max_midi": 88}, {"track_name": "Starlight", "artist_name": "Muse", "min_midi": 68, "max_midi": 83}, {"track_name": "Paint It Black", "artist_name": "The Rolling Stones", "min_midi": 64, "max_midi": 77}, {"track_name": "Hotel California", "artist_name": "The Eagles", "min_midi": 64, "max_midi": 82}];
const NOTE_NAMES = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];

function midiToNote(midi) {
    if (midi === Infinity || midi === -Infinity) return "-";
    return NOTE_NAMES[midi % 12] + (Math.floor(midi / 12) - 1);
}

function isSongInRange(song) {
    return uMin <= song.min_midi && uMax >= song.max_midi;
}

function outOfRangeDiff(song) {
    const uSpan = uMax - uMin;
    const songSpan = song.max_midi - song.min_midi;
    if (songSpan > uSpan) return songSpan - uSpan;
    const lowGap = song.min_midi - uMin;
    const highGap = song.max_midi - uMax;
    return Math.max(0, lowGap, highGap);
}

function sortSongsByRange() {
    songs.sort((a, b) => {
        const aIn = isSongInRange(a);
        const bIn = isSongInRange(b);
        if (aIn !== bIn) return aIn ? -1 : 1;
        if (aIn && bIn) return a.artist_name.localeCompare(b.artist_name, 'es', { sensitivity: 'base' });
        const diffA = outOfRangeDiff(a);
        const diffB = outOfRangeDiff(b);
        if (diffA !== diffB) return diffB - diffA;
        return a.artist_name.localeCompare(b.artist_name, 'es', { sensitivity: 'base' });
    });
}

// Ampliamos el lienzo: Cubre desde C2 (36) hasta C7 (96) para asegurar que nada quede fuera.
const VISUAL_MIN_MIDI = 36; 
const VISUAL_RANGE_SPAN = 60;

let audioCtx, analyser, buf;
let uMin = Infinity, uMax = -Infinity;
let isListening = false;

function buildUI() {
    const container = document.getElementById("songsContainer");
    container.innerHTML = "";

    songs.forEach((song, index) => {
        const sSpan = song.max_midi - song.min_midi;
        const leftPercent = ((song.min_midi - VISUAL_MIN_MIDI) / VISUAL_RANGE_SPAN) * 100;
        const widthPercent = (sSpan / VISUAL_RANGE_SPAN) * 100;

        container.innerHTML += `
            <div class="song-card" id="card-${song.track_name.replace(/\s/g,'')}" style="--entry-index: ${index};">
                <div class="song-info">
                    <div class="song-title">${song.track_name} <span style="font-weight:normal; font-size:14px; color:#aaa;">- ${song.artist_name}</span></div>
                    <div class="feedback-text" id="feedback-${song.track_name.replace(/\s/g,'')}">Esperando tu voz...</div>
                </div>

                <div class="viz-track">
                    <div class="viz-song-range" style="left: ${leftPercent}%; width: ${widthPercent}%;"></div>
                    <div class="viz-user-range" id="uviz-${song.track_name.replace(/\s/g,'')}" style="left: 0%; width: 0%;"></div>
                </div>
            </div>
        `;
    });
}

async function startSystem() {
    document.getElementById("btnStart").style.display = "none";
    document.getElementById("btnReset").style.display = "inline-block";
    document.getElementById("instructions").innerText = "Micrófono activo. Mapeando en tiempo real...";
    document.getElementById("statsPanel").style.display = "flex";

    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 2048;
    buf = new Float32Array(2048);

    try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        const source = audioCtx.createMediaStreamSource(stream);
        source.connect(analyser);
        isListening = true;
        detectPitch();
    } catch (e) {
        alert("Asegúrate de dar permisos de micrófono.");
    }
}

function resetRange() {
    uMin = Infinity;
    uMax = -Infinity;
    document.getElementById("valMin").innerText = "-";
    document.getElementById("valMax").innerText = "-";
    document.getElementById("valSpan").innerText = "0";

    songs.forEach(song => {
        const id = song.track_name.replace(/\s/g,'');
        document.getElementById("feedback-" + id).innerText = "Esperando tu voz...";
        document.getElementById("feedback-" + id).className = "feedback-text";
        const viz = document.getElementById("uviz-" + id);
        viz.style.width = "0%";
    });
}

function detectPitch() {
    if (!isListening) return;
    analyser.getFloat32TimeDomainData(buf);
    let freq = autoCorrelate(buf, audioCtx.sampleRate);

    // Se ajustaron los límites de Hertzios para filtrar mejor
    if (freq > 65 && freq < 1050) { 
        let midi = Math.round(12 * Math.log2(freq / 440) + 69);

        if (midi >= 36 && midi <= 96) {
            document.getElementById("valCurrent").innerText = midiToNote(midi);
            let changed = false;

            if (midi < uMin) { uMin = midi; changed = true; document.getElementById("valMin").innerText = midiToNote(uMin); }
            if (midi > uMax) { uMax = midi; changed = true; document.getElementById("valMax").innerText = midiToNote(uMax); }

            if (changed) {
                document.getElementById("valSpan").innerText = (uMax - uMin);
                updateVisualizations(); 
            }
        }
    }
    requestAnimationFrame(detectPitch);
}

function updateVisualizations() {
    if (uMin === Infinity || uMax === -Infinity) return;

    sortSongsByRange();
    buildUI();

    const uSpan = uMax - uMin;

    songs.forEach(song => {
        const sMin = song.min_midi;
        const sMax = song.max_midi;
        const sSpan = sMax - sMin;
        const id = song.track_name.replace(/\s/g,'');

        const feedbackEl = document.getElementById("feedback-" + id);

        // BUG CORREGIDO: Ya no usamos Math.max. La posición es exacta aunque salgas del límite visual.
        const viz = document.getElementById("uviz-" + id);
        const leftP = ((uMin - VISUAL_MIN_MIDI) / VISUAL_RANGE_SPAN) * 100;
        const widthP = (uSpan / VISUAL_RANGE_SPAN) * 100;
        viz.style.left = leftP + "%";
        viz.style.width = widthP + "%";

        if (sSpan > uSpan) {
            feedbackEl.innerText = `❌ Imposible. Pide ${sSpan} semitonos de amplitud, tú tienes ${uSpan}.`;
            feedbackEl.className = "feedback-text status-impossible";
        } 
        else if (uMin <= sMin && uMax >= sMax) {
            feedbackEl.innerText = "✅ ¡Perfecto! Llegas a los graves y agudos originales.";
            feedbackEl.className = "feedback-text status-perfect";
        } 
        else {
            // Tienes la amplitud, pero estás desfasado.
            if (uMax < sMax) {
                let bajar = sMax - uMax;
                feedbackEl.innerText = `⚠️ Te faltan agudos. Tienes que transportarla -${bajar} semitonos.`;
            } else if (uMin > sMin) {
                let subir = uMin - sMin;
                feedbackEl.innerText = `⚠️ Te faltan graves. Tienes que transportarla +${subir} semitonos.`;
            }
            feedbackEl.className = "feedback-text status-transpose";
        }
    });
}

function autoCorrelate(buf, sampleRate) {
    let SIZE = buf.length; let rms = 0;
    for (let i = 0; i < SIZE; i++) rms += buf[i] * buf[i];
    rms = Math.sqrt(rms / SIZE);
    // Aumentado el umbral de ruido para evitar chasquidos (0.01 a 0.02)
    if (rms < 0.02) return -1;
    let r1 = 0, r2 = SIZE - 1, thres = 0.2;
    for (let i = 0; i < SIZE / 2; i++) if (Math.abs(buf[i]) < thres) { r1 = i; break; }
    for (let i = SIZE - 1; i >= SIZE / 2; i--) if (Math.abs(buf[i]) < thres) { r2 = i; break; }
    buf = buf.slice(r1, r2); SIZE = buf.length;
    let c = new Float32Array(SIZE);
    for (let i = 0; i < SIZE; i++) for (let j = 0; j < SIZE - i; j++) c[i] += buf[j] * buf[j + i];
    let d = 0; while (c[d] > c[d + 1]) d++;
    let maxval = -1, maxpos = -1;
    for (let i = d; i < SIZE; i++) { if (c[i] > maxval) { maxval = c[i]; maxpos = i; } }
    return sampleRate / maxpos;
}

buildUI();
</script>
</body>
</html>
